services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_to_audit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/order_to_audit
      JWT_SECRET: order-to-audit-secret-key-2024
      JWT_EXPIRES_IN: 24h
      NODE_ENV: production
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "node src/db/initDb.js && node src/db/runSeed.js && node src/index.js"

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:

